<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>剣士 - Medieval Runner</title>
  <style>
    /* CSS: リセットと基本レイアウト */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0c10;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none; /* スクロール・ズーム防止 */
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UIレイヤー（タイトル、ゲームオーバー用） */
    .ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(11, 12, 16, 0.85);
      color: #c5c6c7;
      z-index: 10;
      transition: opacity 0.3s;
    }
    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px #000, 0 0 20px #ffd700;
      color: #ffd700; /* ゴールド */
      text-align: center;
      letter-spacing: 0.2em;
    }
    h2 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #8b0000;
      text-shadow: 2px 2px 5px #000;
    }

    .btn {
      padding: 15px 50px;
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(to bottom, #d4af37, #aa8000);
      color: #111;
      border: 2px solid #fff;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.8);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 3px rgba(0,0,0,0.8);
    }

    /* カスタマイズパネル */
    .custom-panel {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border: 1px solid #45a29e;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
      text-align: center;
      max-width: 90%;
    }
    .custom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    input[type="file"] {
      font-size: 0.8rem;
      max-width: 150px;
      color: #fff;
    }
    .small-btn {
      padding: 8px 15px;
      font-size: 0.9rem;
      background: #1f2833;
      color: #c5c6c7;
      border: 1px solid #45a29e;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 縦画面警告用オーバーレイ */
    #orientation-warning {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0c10;
      color: #ffd700;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }
    #orientation-warning p {
      font-size: 1.5rem;
      margin-top: 10px;
    }
    
    /* フルスクリーンボタン */
    #fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      background: rgba(0,0,0,0.5);
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <button id="fullscreen-btn">全画面</button>

  <div id="screen-title" class="ui-layer">
    <h1>剣士</h1>
    <button id="btn-play" class="btn">出陣</button>
    
    <div class="custom-panel">
      <p style="color:#ffd700; font-weight:bold;">【画像差し替え】</p>
      <div class="custom-row">
        <span>自機:</span>
        <input type="file" id="file-player" accept="image/*">
      </div>
      <div class="custom-row">
        <span>背景:</span>
        <input type="file" id="file-bg" accept="image/*">
      </div>
      <button id="btn-reset-img" class="small-btn">画像を初期化</button>
    </div>
  </div>

  <div id="screen-gameover" class="ui-layer hidden">
    <h2>敗北</h2>
    <p style="font-size: 1.5rem; margin-bottom: 20px;">生存時間: <span id="final-score">0.00</span> 秒</p>
    <button id="btn-retry" class="btn">再挑戦</button>
    <button id="btn-title" class="small-btn">タイトルへ</button>
  </div>

  <div id="orientation-warning" class="hidden">
    <div style="font-size: 3rem;">📱🔄</div>
    <p>画面を横にしてください</p>
    <p style="font-size: 1rem; color: #c5c6c7; margin-top: 10px;">ゲームは一時停止しています</p>
  </div>
</div>

<script>
// ==========================================
// 1. CONFIG (ゲーム設定)
// ==========================================
const CONFIG = {
  worldW: 960,
  worldH: 540,
  playerW: 50,
  playerH: 50,
  obstacleSpeed: 450, // px per second
  obstacleSpawnMin: 0.8, // seconds
  obstacleSpawnMax: 1.5,
  followSpeed: 15, // 追従速度
  lanternCount: 25 // 背景の提灯の数
};

// ==========================================
// 2. STATE & VARIABLES
// ==========================================
let state = 'title'; // 'title', 'playing', 'gameover', 'paused'
let previousState = 'title';

let lastTime = 0;
let scoreTime = 0;
let obstacleTimer = 0;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

const player = {
  x: 100,
  y: CONFIG.worldH / 2,
  w: CONFIG.playerW,
  h: CONFIG.playerH,
  targetY: CONFIG.worldH / 2
};

let obstacles = [];
let lanterns = [];

const customImages = {
  player: null,
  bg: null
};

// ==========================================
// 3. DOM ELEMENTS
// ==========================================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const screenTitle = document.getElementById('screen-title');
const screenGameover = document.getElementById('screen-gameover');
const screenWarning = document.getElementById('orientation-warning');
const scoreDisplay = document.getElementById('final-score');
const btnFullscreen = document.getElementById('fullscreen-btn');

const filePlayer = document.getElementById('file-player');
const fileBg = document.getElementById('file-bg');
const btnResetImg = document.getElementById('btn-reset-img');

// ==========================================
// 4. CORE FUNCTIONS (リサイズ・座標変換)
// ==========================================
function computeView() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  canvas.width = winW;
  canvas.height = winH;

  const scaleX = winW / CONFIG.worldW;
  const scaleY = winH / CONFIG.worldH;
  
  scale = Math.min(scaleX, scaleY);
  offsetX = (winW - (CONFIG.worldW * scale)) / 2;
  offsetY = (winH - (CONFIG.worldH * scale)) / 2;

  checkOrientation(winW, winH);
}

function screenToWorld(clientX, clientY) {
  return {
    x: (clientX - offsetX) / scale,
    y: (clientY - offsetY) / scale
  };
}

function checkOrientation(w, h) {
  if (h > w) {
    screenWarning.classList.remove('hidden');
    if (state === 'playing') {
      previousState = state;
      state = 'paused';
    }
  } else {
    screenWarning.classList.add('hidden');
    if (state === 'paused') {
      state = previousState;
      lastTime = performance.now();
    }
  }
}

// ==========================================
// 5. GAME LOGIC
// ==========================================
function initGame() {
  player.y = CONFIG.worldH / 2;
  player.targetY = CONFIG.worldH / 2;
  obstacles = [];
  scoreTime = 0;
  obstacleTimer = 0;
  
  // 背景の提灯初期化
  lanterns = [];
  for (let i = 0; i < CONFIG.lanternCount; i++) {
    lanterns.push({
      x: Math.random() * CONFIG.worldW,
      y: Math.random() * (CONFIG.worldH - 100),
      size: Math.random() * 15 + 10,
      speed: Math.random() * 30 + 10,
      alpha: Math.random() * 0.5 + 0.2
    });
  }
}

function spawnObstacle() {
  const isHorse = Math.random() > 0.6; // 兵士多め、馬少なめ
  
  let w, h;
  if (isHorse) {
    w = 80;
    h = 50; // 馬は横長
  } else {
    w = 40;
    h = 80; // 兵士は縦長
  }
  
  const y = Math.random() * (CONFIG.worldH - h);
  
  obstacles.push({
    x: CONFIG.worldW,
    y: y,
    w: w,
    h: h,
    type: isHorse ? 'horse' : 'soldier'
  });
}

function update(dt) {
  if (state !== 'playing') return;

  scoreTime += dt;
  obstacleTimer -= dt;

  // プレイヤーの移動
  player.y += (player.targetY - (player.y + player.h / 2)) * (CONFIG.followSpeed * dt);
  if (player.y < 0) player.y = 0;
  if (player.y + player.h > CONFIG.worldH) player.y = CONFIG.worldH - player.h;

  // 提灯の移動（背景演出）
  for (let l of lanterns) {
    l.x -= l.speed * dt;
    if (l.x + l.size * 2 < 0) {
      l.x = CONFIG.worldW + l.size;
      l.y = Math.random() * (CONFIG.worldH - 100);
    }
  }

  // 障害物の生成と移動
  if (obstacleTimer <= 0) {
    spawnObstacle();
    obstacleTimer = CONFIG.obstacleSpawnMin + Math.random() * (CONFIG.obstacleSpawnMax - CONFIG.obstacleSpawnMin);
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= CONFIG.obstacleSpeed * dt;

    // 当たり判定 (AABB)
    if (
      player.x < obs.x + obs.w &&
      player.x + player.w > obs.x &&
      player.y < obs.y + obs.h &&
      player.y + player.h > obs.y
    ) {
      gameOver();
    }

    if (obs.x + obs.w < 0) {
      obstacles.splice(i, 1);
    }
  }
}

function gameOver() {
  state = 'gameover';
  screenGameover.classList.remove('hidden');
  scoreDisplay.textContent = scoreTime.toFixed(2);
}

// ==========================================
// 6. DRAWING LOGIC (Canvas Art)
// ==========================================
function drawPlayer(x, y, w, h) {
  // アーサー王（騎士）の描画
  // マント
  ctx.fillStyle = '#8b0000';
  ctx.fillRect(x - 10, y + 10, 20, h - 10);
  
  // 鎧 (ボディ)
  ctx.fillStyle = '#C0C0C0';
  ctx.fillRect(x, y, w, h);
  
  // 王冠 (ゴールドの装飾)
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(x, y, w, 8);
  ctx.fillRect(x + 5, y - 5, 8, 5);
  ctx.fillRect(x + w - 13, y - 5, 8, 5);
  ctx.fillRect(x + w/2 - 4, y - 6, 8, 6);

  // バイザー (兜の隙間)
  ctx.fillStyle = '#111';
  ctx.fillRect(x + 25, y + 15, 25, 4);
  
  // 剣 (前方に突き出す。当たり判定外の演出)
  ctx.fillStyle = '#E0E0E0';
  ctx.fillRect(x + w, y + 25, 35, 6); // 刃
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(x + w, y + 18, 6, 20); // 鍔
}

function drawSoldier(obs) {
  // 兵士の描画
  ctx.fillStyle = '#333'; // 暗い鎧
  ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
  
  // 赤い羽飾り
  ctx.fillStyle = '#aa0000';
  ctx.fillRect(obs.x + 5, obs.y - 8, obs.w - 10, 8);
  
  // 不気味な光る目
  ctx.fillStyle = '#ff4500';
  ctx.fillRect(obs.x - 5, obs.y + 15, 15, 4);
  
  // 槍
  ctx.fillStyle = '#777';
  ctx.fillRect(obs.x - 20, obs.y + 35, 70, 4);
}

function drawHorse(obs) {
  // 馬の描画
  ctx.fillStyle = '#4a3018'; // 焦げ茶
  ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
  
  // 頭
  ctx.fillRect(obs.x - 15, obs.y - 15, 25, 25);
  // たてがみ
  ctx.fillStyle = '#221100';
  ctx.fillRect(obs.x + 10, obs.y - 15, 10, 15);
  // 脚
  ctx.fillStyle = '#221100';
  ctx.fillRect(obs.x + 10, obs.y + obs.h, 12, 15);
  ctx.fillRect(obs.x + obs.w - 22, obs.y + obs.h, 12, 15);
  // しっぽ
  ctx.fillRect(obs.x + obs.w, obs.y + 10, 15, 5);
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  
  ctx.beginPath();
  ctx.rect(0, 0, CONFIG.worldW, CONFIG.worldH);
  ctx.clip();

  // 背景描画
  if (customImages.bg) {
    ctx.drawImage(customImages.bg, 0, 0, CONFIG.worldW, CONFIG.worldH);
  } else {
    // 夜空のグラデーション
    let grad = ctx.createLinearGradient(0, 0, 0, CONFIG.worldH);
    grad.addColorStop(0, '#0b0c10');
    grad.addColorStop(1, '#1f2833');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CONFIG.worldW, CONFIG.worldH);

    // 提灯（ランタン）の光
    for (let l of lanterns) {
      let lGrad = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.size);
      lGrad.addColorStop(0, `rgba(255, 200, 50, ${l.alpha})`);
      lGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
      ctx.fillStyle = lGrad;
      ctx.beginPath();
      ctx.arc(l.x, l.y, l.size, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // 床/天井のライン (ゴールド枠)
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(CONFIG.worldW, 0);
  ctx.moveTo(0, CONFIG.worldH); ctx.lineTo(CONFIG.worldW, CONFIG.worldH);
  ctx.stroke();

  // スコア描画
  if (state === 'playing') {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 30px Arial';
    ctx.textAlign = 'right';
    ctx.fillText(`${scoreTime.toFixed(2)} 秒`, CONFIG.worldW - 20, 40);
  }

  // 障害物描画
  for (let obs of obstacles) {
    if (obs.type === 'soldier') {
      drawSoldier(obs);
    } else {
      drawHorse(obs);
    }
  }

  // プレイヤー描画
  if (customImages.player) {
    ctx.drawImage(customImages.player, player.x, player.y, player.w, player.h);
  } else {
    drawPlayer(player.x, player.y, player.w, player.h);
  }

  ctx.restore();
}

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

// ==========================================
// 7. INPUT HANDLING
// ==========================================
window.addEventListener('resize', computeView);

canvas.addEventListener('pointerdown', handlePointer);
canvas.addEventListener('pointermove', handlePointer);
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

function handlePointer(e) {
  if (state !== 'playing') return;
  if (e.buttons !== 1 && e.pointerType === 'mouse' && e.type !== 'pointerdown') return;
  
  const worldPos = screenToWorld(e.clientX, e.clientY);
  player.targetY = worldPos.y;
}

// UI Buttons
document.getElementById('btn-play').addEventListener('click', () => {
  screenTitle.classList.add('hidden');
  initGame();
  state = 'playing';
  lastTime = performance.now();
});

document.getElementById('btn-retry').addEventListener('click', () => {
  screenGameover.classList.add('hidden');
  initGame();
  state = 'playing';
  lastTime = performance.now();
});

document.getElementById('btn-title').addEventListener('click', () => {
  screenGameover.classList.add('hidden');
  screenTitle.classList.remove('hidden');
  state = 'title';
});

// Fullscreen API
btnFullscreen.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      console.warn("Fullscreen error", err);
    });
  } else {
    document.exitFullscreen();
  }
});
if (!document.fullscreenEnabled) {
  btnFullscreen.style.display = 'none';
}

// ==========================================
// 8. IMAGE UPLOAD & LOCALSTORAGE
// ==========================================
function saveImage(key, file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    try {
      localStorage.setItem('myrunner_' + key, dataUrl);
      loadImage(key, dataUrl);
    } catch(err) {
      alert("画像サイズが大きすぎます。小さい画像をお試しください。");
    }
  };
  reader.readAsDataURL(file);
}

function loadImage(key, dataUrl) {
  const img = new Image();
  img.onload = () => {
    customImages[key] = img;
  };
  img.src = dataUrl;
}

function loadSavedImages() {
  const pData = localStorage.getItem('myrunner_player');
  const bgData = localStorage.getItem('myrunner_bg');
  if (pData) loadImage('player', pData);
  if (bgData) loadImage('bg', bgData);
}

filePlayer.addEventListener('change', (e) => saveImage('player', e.target.files[0]));
fileBg.addEventListener('change', (e) => saveImage('bg', e.target.files[0]));

btnResetImg.addEventListener('click', () => {
  localStorage.removeItem('myrunner_player');
  localStorage.removeItem('myrunner_bg');
  customImages.player = null;
  customImages.bg = null;
  filePlayer.value = '';
  fileBg.value = '';
  alert("画像を初期化しました");
});

// ==========================================
// 9. INITIALIZATION
// ==========================================
computeView();
loadSavedImages();
initGame(); // タイトル画面描画用
requestAnimationFrame(loop);

</script>
</body>
</html>
